services:
  netrack:
    image: ghcr.io/diaszano/netrack:latest
    container_name: netrack
    network_mode: host
    environment:
      - TZ=America/Sao_Paulo
      # - NETRACK_PORT=5216
      # - RUN_TEST_ON_STARTUP=false
      # - RUST_LOG=info
    volumes:
      - ./data:/data
    restart: unless-stopped
