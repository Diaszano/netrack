name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      # Bare semver ("0.2.1"); tag_name is "netrack-v0.2.1", which metadata-action can't parse.
      version: ${{ steps.rp.outputs.version }}
    steps:
      # Opens/updates a release PR from the Conventional Commits on main (bumps Cargo.toml,
      # Cargo.lock and CHANGELOG.md). Merging it creates the tag and the GitHub release.
      # Use a PAT in RELEASE_PLEASE_TOKEN if the release PR must trigger CI (GITHUB_TOKEN PRs don't).
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Enables auto-merge on the release PR (falls back to immediate merge when no required checks
      # are pending). Requires a PAT in RELEASE_PLEASE_TOKEN so the merge commit triggers the next
      # Release run (tag + GHCR publish); merges made with GITHUB_TOKEN do not trigger workflows.
      - name: Auto-merge release PR
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          PR_NUMBER=$(jq -r '.number // empty' <<<"$PR_JSON")
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --auto --squash --delete-branch \
              || gh pr merge "$PR_NUMBER" --squash --delete-branch
          fi

  docker:
    name: Publish image to GHCR
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }},enable=${{ !startsWith(needs.release-please.outputs.version, '0.') }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
