name: Security

on:
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", ".github/workflows/security.yml"]
  push:
    branches: ["main"]
    paths: ["Cargo.toml", "Cargo.lock"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  checks: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
