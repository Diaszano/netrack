name: Security

on:
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", ".github/workflows/security.yml"]
  push:
    branches: ["main"]
    paths: ["Cargo.toml", "Cargo.lock"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary; the action rustsec/audit-check needs the checks API, which fails on some PRs.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; unmaintained-crate warnings do not fail the job.
      - run: cargo audit --file Cargo.lock
