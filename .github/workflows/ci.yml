name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust & Web UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Frontend Unit Tests
        run: node --test web/tests/*.test.js

      - name: Setup Rust Toolchain
        # Installs the version pinned in rust-toolchain.toml, so CI matches local and Docker builds.
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust Unit & Integration Tests
        run: cargo test --locked

  docker:
    name: Multi-Arch Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Single required check for branch protection.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: always()
    steps:
      - run: |
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.docker.result }}" = success ]
