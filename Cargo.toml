[package]
name = "netrack"
version = "0.1.0"
edition = "2024"

[lib]
name = "netrack"
path = "src/lib.rs"

[[bin]]
name = "netrack"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4.45"
chrono-tz = "0.10"
croner = "4.0.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
