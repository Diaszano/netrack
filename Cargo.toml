[package]
name = "netrack"
version = "0.2.1"
edition = "2024"

[lib]
name = "netrack"
path = "src/lib.rs"

[[bin]]
name = "netrack"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["macros"] }
socket2 = "0.6"
bytes = "1.12.1"
chrono = "0.4.45"
chrono-tz = "0.10"
croner = "4.0.3"
flate2 = "1.0"
futures = "0.3.34"
if-addrs = "0.15.0"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "metrics", "logs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
